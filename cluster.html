<body>

<div id="header">
  <h1><img src="Icons/BunnyGameLogo.svg" alt="Bunny Game" style="height:30px;filter:brightness(0) invert(1);display:block;"></h1>
  <div class="header-controls">
    <button class="icon-btn" id="help-btn" aria-label="How to play">?</button>
    <button class="icon-btn" id="new-btn">↺ New</button>
  </div>
</div>

<div id="nav-root"></div>

<div id="stats">
  <div class="stat-item">
    <span class="stat-label">Score</span>
    <span class="stat-value" id="val-score">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Shots</span>
    <span class="stat-value" id="val-shots">50</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Bubbles</span>
    <span class="stat-value" id="val-bubbles">90</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Best</span>
    <span class="stat-value" id="val-best">—</span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="game-canvas"></canvas>

  <div id="cl-toast"></div>

  <div id="cl-start">
    <img src="assets/logos/cluster_logo.svg" alt="Cluster" class="cl-splash-logo">
    <p class="cl-splash-line">The whole mass hangs off one spinner. Match three to pop — and every shot that lands off-centre turns the board.</p>
    <button class="cl-btn" id="cl-play-btn">Play</button>
  </div>
</div>

  <div class="modal">
    <div id="perf-banner" class="hidden"></div>
    <h2 id="modal-title">OUT OF BUBBLES</h2>
    <p class="modal-score" id="modal-score"></p>
    <p class="modal-sub"   id="modal-sub"></p>
    <div class="breakdown" id="modal-breakdown"></div>
    <button class="play-again-btn" id="play-again-btn">Play Again</button>
    <button class="share-btn" id="share-btn">Share Score</button>
  </div>
</div>

<div id="directions-overlay" class="hidden">
  <div class="directions-modal">
    <p class="dir-heading">How to Play</p>
    <div class="dir-pane" id="directions-text"></div>
    <button class="dir-close-btn" id="dir-close-btn">Got It</button>
  </div>
</div>
