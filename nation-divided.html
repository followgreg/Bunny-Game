<body>

<div id="header">
  <h1><img src="Icons/BunnyGameLogo.svg" alt="Bunny Game" style="height:30px;filter:brightness(0) invert(1);display:block;"></h1>
  <div class="header-controls">
    <button class="icon-btn" id="help-btn">How to play</button>
  </div>
</div>

<div id="nav-root"></div>

<div id="stats">
  <div class="stat-item cut-stat-level">
    <span class="stat-label">Level</span>
    <button class="cut-step" id="cut-prev" aria-label="Previous level">&lsaquo;</button>
    <span class="stat-value" id="val-level">1 / 100</span>
    <button class="cut-step" id="cut-nextlvl" aria-label="Next level">&rsaquo;</button>
  </div>
  <div class="stat-item cut-stat-object">
    <span class="stat-label">Country</span>
    <span class="stat-value" id="val-object">&mdash;</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Best</span>
    <span class="stat-value" id="val-best">&mdash;</span>
  </div>
</div>

<div id="canvas-wrap">
  <div id="cut-stage">
    <canvas id="game-canvas"></canvas>

    <div id="nd-ident">
      <img id="nd-flag" alt="">
      <span id="nd-name"></span>
    </div>

    <div id="cut-toast"></div>

    <div id="cut-actions" class="cut-hide">
      <button type="button" class="cut-btn cut-btn-primary cut-hide" id="cut-next-btn">Next Level</button>
      <button type="button" class="cut-btn" id="cut-again-btn">Try Again</button>
      <button type="button" class="cut-btn" id="cut-share-btn">Share Result</button>
    </div>

    <div id="cut-start">
      <img src="assets/logos/nationdivided_logo.svg" alt="Nation Divided" class="cut-splash-logo">
      <p class="cut-splash-line" id="nd-splash-line">One straight drag splits the country in two. The scale tells you how far off half you were — get within 5% and the next one unlocks.</p>
      <button type="button" class="cut-btn cut-btn-primary" id="cut-play-btn">Play</button>
    </div>
  </div>
</div>

    <p class="dir-heading">How to Play</p>
    <div class="dir-pane" id="directions-text"></div>
    <button class="dir-close-btn" id="dir-close-btn">Got It</button>
  </div>
</div>
