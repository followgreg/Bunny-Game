  <link rel="icon" type="image/svg+xml" href="assets/icons/blue-bunny.svg">
  <link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bunny Game">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7HC7SYBNKX"></script>

    gtag('js', new Date());
    gtag('config', 'G-7HC7SYBNKX');

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/circuit.css">

       crossorigin="anonymous"></script>

<body>

<div id="header">
  <h1><img src="Icons/BunnyGameLogo.svg" alt="Bunny Game" style="height:30px;filter:brightness(0) invert(1);display:block;"></h1>
  <div class="header-controls">
    <button class="icon-btn" id="help-btn">How to play</button>
  </div>
</div>

<div id="nav-root"></div>

<div id="canvas-wrap">

  <!-- Splash — shown on every page load (buttons populated by JS) -->
  <div id="ct-start" class="ct-screen ct-hide">
    <div class="ct-start-inner">
      <img src="assets/logos/circuit_logo.svg" alt="Circuit" class="ct-start-logo">
      <p class="ct-sub" id="ct-splash-dir"></p>
      <div class="ct-start-btns" id="ct-start-btns"></div>
    </div>
  </div>

  <!-- Game screen -->
  <div id="ct-game" class="ct-screen">
    <div class="ct-hud" id="ct-hud">
      <span id="ct-level-label">Level 1</span>
      <span id="ct-furthest-label"></span>
    </div>

    <div class="ct-board-wrap" id="ct-board-wrap">
      <svg id="ct-svg" class="ct-svg" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Circuit hex grid"></svg>
    </div>

    <div class="ct-shelf-wrap">
      <p class="ct-shelf-label" id="ct-shelf-label">Pieces</p>
      <div class="ct-shelf" id="ct-shelf"></div>
    </div>
  </div>

  <!-- Congratulations overlay (level complete) -->
  <div id="ct-congrats" class="ct-congrats ct-hide">
    <p class="ct-congrats-head">Circuit Complete!</p>
    <p class="ct-congrats-sub" id="ct-congrats-sub">Level 1 of 25</p>
    <button class="ct-btn-primary" id="ct-next-level">Next Level</button>
  </div>

  <!-- Win screen (all 25 levels) -->
  <div id="ct-win" class="ct-screen ct-hide">
    <div class="ct-win-inner">
      <img src="assets/logos/circuit_logo.svg" alt="Circuit" class="ct-win-logo">
      <h2 class="ct-win-headline">Complete</h2>
      <p class="ct-win-sub" id="ct-win-sub">All 25 circuits powered.</p>
      <div class="ct-win-btns">
        <button class="ct-btn-primary" id="ct-share">Share</button>
        <button class="ct-btn-ghost"   id="ct-play-again">Play Again</button>
      </div>
    </div>
  </div>

</div>

<div id="directions-overlay" class="hidden">
  <div class="directions-modal">
    <img src="assets/logos/circuit_logo.svg" alt="Circuit" class="ct-dir-logo">
    <p class="dir-heading">How to play</p>
    <div id="directions-text"></div>
    <button class="dir-close-btn" id="dir-close-btn">Got it</button>
  </div>
</div>

<script src="assets/js/nav.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/circuit.js"></script>
</body>
</html>
